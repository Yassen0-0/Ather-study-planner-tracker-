include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Git worktrees contain their own copies of lib/ — analyzing them
    # against this checkout's dependencies produces phantom errors.
    - .claude/worktrees/**/
    - wt-session-a/**
    - wt-session-b/**
    - .auto-claude/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:

